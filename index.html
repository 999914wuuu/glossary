<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", sans-serif; background: #f5f1e3; min-height: 100vh; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── Layout ── */
    .app-bg {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 20%, rgba(183,200,161,0.28) 0%, transparent 55%),
        radial-gradient(ellipse at 88% 78%, rgba(183,200,161,0.22) 0%, transparent 55%),
        #f5f1e3;
    }
    .app { max-width: 640px; margin: 0 auto; padding: 28px 20px 56px; animation: fadeIn 0.4s ease; }

    /* ── Header ── */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 22px; }
    .title { font-family: "Noto Serif TC", serif; font-size: 21px; color: #3d4a30; font-weight: 600; }
    .badge {
      background: #b7c8a1; color: #fffdf5;
      font-size: 11px; padding: 2px 9px; border-radius: 9999px; font-weight: 600;
      display: none;
    }
    .icon-btn {
      width: 34px; height: 34px; background: #fffdf5;
      border: 1px solid #b7c8a1; border-radius: 8px; color: #5b684b;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #e0ecda; }
    .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinning { animation: spin 0.7s linear infinite; display: inline-block; }

    /* ── Loading / Error ── */
    .center-msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 0; gap: 16px;
      color: #8a9e74; font-size: 15px;
    }
    .big-spinner {
      width: 36px; height: 36px;
      border: 3px solid #d8e8c8; border-top-color: #7a9e6a;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .error-box { text-align: center; padding: 60px 20px; }
    .error-box .icon { font-size: 36px; margin-bottom: 12px; }
    .error-box p { font-size: 14px; color: #b04040; margin-bottom: 20px; }
    .btn-retry {
      padding: 9px 24px; background: #4a5f38; color: #f5f1e3;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-retry:hover { background: #3a4f2a; }

    /* ── Categories ── */
    .categories { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .cat-tag {
      padding: 5px 15px; border-radius: 9999px; font-size: 13px;
      border: 1.5px solid #b7c8a1; background: #e8d9b7; color: #5b684b;
      cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .cat-tag:hover { background: #ddd0a8; }
    .cat-tag.active { background: #4a5f38; color: #f5f1e3; border-color: #4a5f38; }

    /* ── Divider ── */
    .section-divider {
      border: none; border-top: 1px solid #d0c9b0;
      margin: 12px 0 16px;
    }

    /* ── Controls ── */
    .controls { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .ctrl-btn {
      padding: 7px 16px; background: #fffdf5;
      border: 1.5px solid #b7c8a1; border-radius: 8px;
      color: #5b684b; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .ctrl-btn:hover { background: #e8f0e0; }
    .ctrl-btn.active { background: #4a5f38; color: #f5f1e3; border-color: #4a5f38; }

    /* ── Flashcard ── */
    .card-wrap { perspective: 1200px; margin-bottom: 22px; cursor: pointer; min-height: 260px; position: relative; }
    .card-inner {
      min-height: 260px; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: #fffdf5; border: 1.5px solid #b7c8a1; border-radius: 18px;
      padding: 40px 32px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      box-shadow: 0 4px 24px rgba(61,74,48,0.09);
    }
    .face-back { transform: rotateY(180deg); }
    .word {
      font-family: "Noto Sans TC", sans-serif;
      font-size: 34px; font-weight: 600; color: #3d4a30;
      margin-bottom: 14px; line-height: 1.4;
    }
    .tap-hint { font-size: 13px; color: #a0b87a; }
    .sub-en   { font-size: 17px; color: #6a7a58; margin-bottom: 10px; }
    .sub-memo { font-size: 14px; color: #7a8a65; margin-bottom: 10px; white-space: pre-line; max-width: 460px; line-height: 1.7; }
    .sub-cat  { font-size: 12px; color: #a0b87a; margin-top: 4px; }

    /* ── Navigation ── */
    .nav { display: flex; align-items: center; justify-content: space-between; }
    .nav-btn {
      padding: 9px 20px; background: #e8d9b7; color: #5b684b;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background 0.15s;
    }
    .nav-btn:hover { background: #d8c8a0; }
    .counter { font-size: 14px; color: #8a9e74; font-weight: 500; }
    .sep { color: #c8d8b5; margin: 0 2px; }

    .empty { text-align: center; padding: 64px 0; color: #8a9e74; font-size: 15px; line-height: 2; }

    /* ── Hidden helper ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-bg">
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">🍵</span>
        <h1 class="title">單字卡</h1>
        <span class="badge" id="badge"></span>
      </div>
      <div>
        <button class="icon-btn" id="refreshBtn" title="重新載入">↻</button>
      </div>
    </header>

    <!-- Loading -->
    <div class="center-msg" id="loadingMsg">
      <div class="big-spinner"></div>
      <p>載入中...</p>
    </div>

    <!-- Error -->
    <div class="error-box hidden" id="errorBox">
      <div class="icon">⚠️</div>
      <p id="errorText"></p>
      <button class="btn-retry" id="retryBtn">重試</button>
    </div>

    <!-- Main (hidden until loaded) -->
    <div class="hidden" id="main">
      <div class="categories" id="categories"></div>
      <hr class="section-divider" id="divider">
      <div class="controls">
        <button class="ctrl-btn" id="langBtn">中 → 日</button>
        <button class="ctrl-btn" id="shuffleBtn">🔀 隨機</button>
        <button class="ctrl-btn" id="randomBtn">🎲 骰子</button>
      </div>

      <!-- Card -->
      <div class="card-wrap" id="cardWrap">
        <div class="card-inner" id="cardInner">
          <div class="face face-front" id="faceFront">
            <div class="word" id="frontWord"></div>
            <div class="tap-hint">點擊查看答案</div>
          </div>
          <div class="face face-back" id="faceBack">
            <div class="word" id="backWord"></div>
            <div class="sub-en"   id="backEn"></div>
            <div class="sub-memo" id="backMemo"></div>
            <div class="sub-cat"  id="backCat"></div>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div class="empty hidden" id="emptyMsg">
        <div style="font-size:40px;margin-bottom:12px">🌿</div>
        沒有符合所選分類的單字卡
      </div>

      <!-- Navigation -->
      <div class="nav" id="nav">
        <button class="nav-btn" id="prevBtn">← 上一個</button>
        <span class="counter">
          <span id="currentNum">1</span><span class="sep"> / </span><span id="totalNum">0</span>
        </span>
        <button class="nav-btn" id="nextBtn">下一個 →</button>
      </div>
    </div>

  </div>
</div>

<script>
  // ── 設定：填入你的 Worker 網址 ──────────────────────────────
  const WORKER_URL = "https://YOUR_WORKER_NAME.YOUR_SUBDOMAIN.workers.dev";
  // ────────────────────────────────────────────────────────────

  // ── 狀態 ─────────────────────────────────────────────────────
  let allCards         = [];
  let filteredCards    = [];
  let allCategories    = [];
  let selectedCats     = [];
  let currentIndex     = 0;
  let isFlipped        = false;
  let startLang        = "zh-tw";  // 正面語言
  let isShuffled       = false;

  // ── DOM ──────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const loadingMsg  = $("loadingMsg");
  const errorBox    = $("errorBox");
  const errorText   = $("errorText");
  const main        = $("main");
  const badge       = $("badge");
  const categoriesEl= $("categories");
  const cardInner   = $("cardInner");
  const frontWord   = $("frontWord");
  const backWord    = $("backWord");
  const backEn      = $("backEn");
  const backMemo    = $("backMemo");
  const backCat     = $("backCat");
  const currentNum  = $("currentNum");
  const totalNum    = $("totalNum");
  const cardWrap    = $("cardWrap");
  const emptyMsg    = $("emptyMsg");
  const nav         = $("nav");
  const langBtn     = $("langBtn");
  const shuffleBtn  = $("shuffleBtn");

  // ── 工具 ─────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── 載入資料 ──────────────────────────────────────────────────
  async function fetchCards() {
    loadingMsg.classList.remove("hidden");
    errorBox.classList.add("hidden");
    main.classList.add("hidden");

    // 顯示 refresh 按鈕轉圈
    const refreshBtn = $("refreshBtn");
    refreshBtn.disabled = true;
    refreshBtn.innerHTML = '<span class="spinning">↻</span>';

    try {
      const res  = await fetch(WORKER_URL);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "載入失敗");
      initCards(data.cards);
    } catch (e) {
      loadingMsg.classList.add("hidden");
      errorBox.classList.remove("hidden");
      errorText.textContent = e.message || "無法連線，請稍後再試";
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.innerHTML = "↻";
    }
  }

  function initCards(cards) {
    allCards = cards;

    // 收集所有分類
    const catSet = new Set();
    cards.forEach((c) => c.categories.forEach((cat) => catSet.add(cat)));
    allCategories = [...catSet];
    selectedCats  = [];

    // 渲染分類標籤
    renderCategories();
    applyFilter();

    // 顯示主畫面
    loadingMsg.classList.add("hidden");
    main.classList.remove("hidden");
    badge.textContent = `${allCards.length} 字`;
    badge.style.display = "inline-block";
  }

  // ── 分類 ─────────────────────────────────────────────────────
  function renderCategories() {
    categoriesEl.innerHTML = "";
    allCategories.forEach((cat) => {
      const btn = document.createElement("button");
      btn.className = "cat-tag" + (selectedCats.includes(cat) ? " active" : "");
      btn.textContent = cat;
      btn.onclick = () => toggleCategory(cat);
      categoriesEl.appendChild(btn);
    });
  }

  function toggleCategory(cat) {
    selectedCats = selectedCats.includes(cat)
      ? selectedCats.filter((c) => c !== cat)
      : [...selectedCats, cat];
    renderCategories();
    applyFilter();
  }

  function applyFilter() {
    let result = selectedCats.length === 0
      ? [...allCards]
      : allCards.filter((c) => c.categories.some((cat) => selectedCats.includes(cat)));
    filteredCards = isShuffled ? shuffle(result) : result;
    currentIndex  = 0;
    isFlipped     = false;
    renderCard();
  }

  // ── 渲染卡片 ──────────────────────────────────────────────────
  function renderCard() {
    const isEmpty = filteredCards.length === 0;
    cardWrap.classList.toggle("hidden", isEmpty);
    nav.classList.toggle("hidden", isEmpty);
    emptyMsg.classList.toggle("hidden", !isEmpty);
    if (isEmpty) return;

    const card       = filteredCards[currentIndex];
    const answerLang = startLang === "zh-tw" ? "jp" : "zh-tw";

    // 正面
    frontWord.textContent = card[startLang];

    // 背面
    backWord.textContent  = card[answerLang];
    backEn.textContent    = card.en   ? "🔤 " + card.en   : "";
    backMemo.textContent  = card.memo ? "📝 " + card.memo : "";
    backCat.textContent   = "🏷 " + card.category;
    backEn.classList.toggle("hidden",   !card.en);
    backMemo.classList.toggle("hidden", !card.memo);

    // 翻牌狀態
    cardInner.classList.toggle("flipped", isFlipped);

    // 計數器
    currentNum.textContent = currentIndex + 1;
    totalNum.textContent   = filteredCards.length;
  }

  // ── 互動 ─────────────────────────────────────────────────────
  $("cardWrap").onclick = () => { isFlipped = !isFlipped; renderCard(); };

  $("prevBtn").onclick = () => {
    currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
    isFlipped = false; renderCard();
  };
  $("nextBtn").onclick = () => {
    currentIndex = (currentIndex + 1) % filteredCards.length;
    isFlipped = false; renderCard();
  };
  $("randomBtn").onclick = () => {
    currentIndex = Math.floor(Math.random() * filteredCards.length);
    isFlipped = false; renderCard();
  };

  langBtn.onclick = () => {
    startLang = startLang === "zh-tw" ? "jp" : "zh-tw";
    langBtn.textContent = startLang === "zh-tw" ? "中 → 日" : "日 → 中";
    isFlipped = false; renderCard();
  };

  shuffleBtn.onclick = () => {
    isShuffled = !isShuffled;
    shuffleBtn.textContent = isShuffled ? "🔀 隨機中" : "🔀 隨機";
    shuffleBtn.classList.toggle("active", isShuffled);
    applyFilter();
  };

  $("refreshBtn").onclick = fetchCards;
  $("retryBtn").onclick   = fetchCards;

  // ── 鍵盤快捷鍵 ───────────────────────────────────────────────
  document.addEventListener("keydown", (e) => {
    if (filteredCards.length === 0) return;
    if (e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      isFlipped = !isFlipped; renderCard();
    } else if (e.key === "ArrowRight") {
      currentIndex = (currentIndex + 1) % filteredCards.length;
      isFlipped = false; renderCard();
    } else if (e.key === "ArrowLeft") {
      currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
      isFlipped = false; renderCard();
    }
  });

  // ── 啟動 ─────────────────────────────────────────────────────
  fetchCards();
</script>
</body>
</html>
